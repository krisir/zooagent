[package]
name = "zooagent-desktop"
version = "0.1.0"
description = "zooagent - local-first personal AI application platform"
authors = ["zooagent"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zooagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
