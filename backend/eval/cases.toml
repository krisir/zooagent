# 生成质量评测用例（设计文档 13.4）
#
# 每个用例包含：需求描述（prompt/turns）、必须通过的 provider 类型、以及结构化的期望。
# 期望只检查"应用是否真的能干活"（模型/字段/关系/Action/页面覆盖），不比对具体文案，
# 因此同一套用例可以直接用来横向比较不同模型（--provider llm --profile xxx）。
#
# providers 含义：
#   offline = 内置模板规划器（无密钥）   mock = AgentScope 接口的 mock（无密钥）
#   llm     = 真实模型（agentscope / openai / ollama ...）
# 需要 llm 的用例在未配置模型时会被「跳过」而不是失败，方便 CI 里只跑无密钥子集。

# ------------------------------------------------------------------------------
# 1. 家庭记账 —— 五个 domain 里唯一能同时被 offline/mock/llm 覆盖的
# ------------------------------------------------------------------------------
[[case]]
id = "finance-basic"
domain = "家庭记账"
providers = ["offline", "mock", "llm"]
tags = ["ci", "structural"]
notes = "最基础的需求：收支记录 + 分类统计"
prompt = "我想记录家里的收入和支出，按分类统计，月底能看清楚钱都花在哪里了。"

[case.expect]
application_created = true
model_count = { min = 2, max = 6 }
total_field_count = { min = 4, max = 40 }
relation_count = { min = 1, max = 5 }
action_count = { min = 1, max = 6 }
action_step_count = { min = 1 }
page_count = { min = 1, max = 8 }
data_table_count = { min = 1, max = 8 }
record_count = { min = 0 }
tool_failures = { max = 0 }
core_ops_covered = true
relation_targets_resolve = true
actions_valid = true
no_default_on_required = true
enum_options_present = true
keys_valid = true
field_names_chinese = { min = 0.6 }
forbidden_key_fragments = ["sqlite", "drop table", "select ", ";", "--", "/*"]

[[case.expect.concept_fields]]
type = "decimal"
hints = ["amount", "金额", "价格", "余额", "money"]
description = "记录金额的数值字段"

[[case.expect.concept_fields]]
type = "date"
hints = ["date", "日期", "时间"]
description = "记录发生日期的字段"

[[case.expect.concept_fields]]
type = "relation"
hints = ["category", "分类", "类别", "账户", "account"]
description = "分类或账户关联"

